services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalgo_credit}
      POSTGRES_USER: ${POSTGRES_USER:-globalgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalgo}
    volumes:
      - globalgo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalgo} -d ${POSTGRES_DB:-globalgo_credit}"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: ./backend
      dockerfile: GlobalGo.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-globalgo_credit};Username=${POSTGRES_USER:-globalgo};Password=${POSTGRES_PASSWORD:-globalgo}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

volumes:
  globalgo_postgres_data:
