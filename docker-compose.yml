services:
  postgres:
    image: postgres:16-alpine
    container_name: globalgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalgo_credit
      POSTGRES_USER: globalgo
      POSTGRES_PASSWORD: globalgo
    ports:
      - "5433:5432"
    volumes:
      - globalgo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalgo -d globalgo_credit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  globalgo_postgres_data:
